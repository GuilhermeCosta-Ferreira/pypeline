[project]
name = "pypeline"
version = "0.1.0"
description = ""
authors = [
    {name = "GuilhermeCF",email = "guilherme.henriquesdacostaferreira@epfl.ch"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
]

[tool.poetry]
packages = [{include = "pypeline", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "classpy @ git+https://github.com/GuilhermeCosta-Ferreira/ClassyPython.git",
    "black (>=26.10.1,<27.0.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "docformatter (>=1.7.8,<2.0.0)",
    "pyright (>=1.1.414,<2.0.0)",
    "ruff (>=0.17.4,<0.18.0)"
]

[tool.docformatter]
recursive = true
in-place = true
wrap-summaries = 88
wrap-descriptions = 88
black = true

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
